services:
  - type: web
    name: booktime-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -u start_render.py
    plan: free

    # Variables d'environnement
    # Les valeurs "sync: false" doivent être saisies manuellement
    # dans le dashboard Render (Settings > Environment)
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      - key: RAILWAY_MONGODB_MOCK
        value: "false"
      - key: MONGO_URL
        value: "mongodb+srv://berruyerpaul222_db_user:TggFAId06ZwWKEPC@booktime-prod.wnnbmls.mongodb.net/?retryWrites=true&w=majority"
      - key: SECRET_KEY
        generateValue: true  # ← Render génère automatiquement une clé sécurisée
      - key: CORS_ORIGINS
        value: "https://booktime.vercel.app,https://booktime-sg59.vercel.app,https://booktime-sg59-git-main-paul6181686167s-projects.vercel.app,http://localhost:3000,https://booktime-uo15.onrender.com"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "86400"
      - key: REMEMBER_ME_EXPIRE_MINUTES
        value: "129600"
      - key: SESSION_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        value: "https://booktime-sg59.vercel.app"
