services:
  - type: web
    name: booktime-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python start_render.py
    plan: free

    # Variables d'environnement
    # Les valeurs "sync: false" doivent être saisies manuellement
    # dans le dashboard Render (Settings > Environment)
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      - key: RAILWAY_MONGODB_MOCK
        value: "false"
      - key: MONGO_URL
        value: "mongodb+srv://berruyerpaul222_db_user:%2AJZ0kDRsJgD3Hag1I1q3@booktime-prod.wnnbmls.mongodb.net/?appName=booktime-prod&retryWrites=true&w=majority&authSource=admin"
      - key: SECRET_KEY
        generateValue: true  # ← Render génère automatiquement une clé sécurisée
      - key: CORS_ORIGINS
        value: "https://booktime.vercel.app,https://booktime-sg59-git-main-paul6181686167s-projects.vercel.app,http://localhost:3000,https://booktime-uo15.onrender.com"
