<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#234f37" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Booktime" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Booktime" />
    <meta
      name="description"
      content="Booktime — suis tes lectures, découvre des séries et gère ta bibliothèque."
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <title>Booktime</title>

    <style>
      /* Splash / loading — thème app */
      #loading {
        position: fixed;
        inset: 0;
        background: #bce8cb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 9999;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      @media (prefers-color-scheme: dark) {
        #loading { background: #234f37; }
      }

      #loading img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e5e7eb;
        border-top-color: #16a34a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @media (prefers-color-scheme: dark) {
        .spinner { border-color: #374151; border-top-color: #22c55e; }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loaded #loading {
        display: none;
      }

      /* Empêche le bounce overscroll ; fond vert dès le 1er paint (mobile/PWA/natif) */
      html, body, #root {
        overscroll-behavior-y: none;
        min-height: 100%;
        background-color: #bce8cb;
      }
      @media (prefers-color-scheme: dark) {
        html, body, #root { background-color: #234f37; }
      }
    </style>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>

    <div id="loading">
      <img src="%PUBLIC_URL%/icon-192.png" alt="Booktime" width="72" height="72" />
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <div id="root"></div>

    <script>
      window.addEventListener('load', function() {
        document.body.classList.add('loaded');
      });
    </script>
  </body>
</html>
