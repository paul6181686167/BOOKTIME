<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Booktime" />
    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="BOOKTIME - Votre application de tracking de livres personnelle"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <title>BOOKTIME - Track your books</title>
    
    <style>
      /* Loading spinner */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top: 4px solid #f04fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide loading when React loads */
      .loaded #loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    
    <!-- Loading spinner -->
    <div id="loading">
      <div class="spinner"></div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide loading spinner when React loads
      window.addEventListener('load', function() {
        document.body.classList.add('loaded');
      });
      
      // 🔍 SCRIPTS D'ANALYSE GLOBALE DES SÉRIES
      // Chargement des analyseurs après le chargement de React
      window.addEventListener('load', function() {
        // Attendre que React soit chargé
        setTimeout(function() {
          // Charger les analyseurs de série
          if (window.SeriesAnalyzer) {
            console.log('🔍 SeriesAnalyzer disponible globalement');
            console.log('💡 Commandes disponibles:');
            console.log('   - analyzeAllSeries() : Analyse tous les livres');
            console.log('   - updateDetectedSeries() : Met à jour les séries détectées');
            console.log('   - generateSeriesReport() : Génère un rapport complet');
          }
          
          if (window.AutoSeriesDetector) {
            console.log('🤖 AutoSeriesDetector disponible globalement');
            console.log('💡 Détection automatique activée lors de l\'ajout de livres');
          }
          
          if (window.SeriesReportGenerator) {
            console.log('📊 SeriesReportGenerator disponible globalement');
            console.log('💡 Génération de rapports détaillés disponible');
          }
          
          // Charger le script de démonstration
          const script = document.createElement('script');
          script.src = '/seriesAnalysisDemo.js';
          script.onload = function() {
            console.log('🚀 Script de démonstration chargé !');
            console.log('💡 Tapez showSeriesAnalysisHelp() pour voir l\'aide');
          };
          document.head.appendChild(script);
        }, 2000);
      });
    </script>
  </body>
</html>
